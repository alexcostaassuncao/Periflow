# Dispara as publicações agendadas do Instagram de hora em hora.
# Configure em GitHub → Settings → Secrets and variables → Actions:
#   SITE_URL     endereço do site, ex.: https://periflow.vercel.app
#   CRON_SECRET  a mesma chave definida na Vercel
name: Publicações agendadas

on:
  schedule:
    - cron: "2 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Processar fila de publicações
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL/CRON_SECRET não configurados; nada a fazer."; exit 0; fi
          curl --fail-with-body -sS -X POST "$SITE_URL/api/publications/run" -H "Authorization: Bearer $CRON_SECRET"
