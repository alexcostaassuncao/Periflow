# Envia os lembretes mensais de banners (aba Projetos → Empresas com webhook), 1x por dia às 09:00 de Brasília.
# Usa os mesmos segredos do agendador de publicações (GitHub → Settings → Secrets and variables → Actions):
#   SITE_URL     endereço do site, ex.: https://periflow.vercel.app
#   CRON_SECRET  a mesma chave definida na Vercel
name: Lembretes de banners

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enviar lembretes pendentes
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL/CRON_SECRET não configurados; nada a fazer."; exit 0; fi
          curl --fail-with-body -sS -X POST "$SITE_URL/api/projetos/banners" -H "Authorization: Bearer $CRON_SECRET"
