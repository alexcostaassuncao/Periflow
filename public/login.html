<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar • Periflow</title>
<link rel="icon" href="/favicon.svg">
<style>
:root{--orange:#ff5000;--text:#fff;--muted:#8a8a8a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#000;color:var(--text)}
.showcase{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#000;border-right:1px solid #ffffff0d;padding:32px}
.showcase img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:.1;transform:scale(1.5);pointer-events:none}
.showcase h2{position:relative;margin:0;font-size:clamp(44px,5vw,64px);font-weight:900;text-transform:uppercase;letter-spacing:-.05em;line-height:1}
.accent{color:var(--orange)}
.panel{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 24px;background:#151515}
.card{width:min(380px,100%)}
.brand{text-align:center;margin-bottom:32px}
.brand img{height:44px;max-width:100%;object-fit:contain;margin-bottom:24px}
h1{font-size:24px;font-weight:900;margin:0;text-transform:uppercase;letter-spacing:-.03em}
.brand p{margin:8px 0 0;color:var(--muted);font-size:13px;font-weight:600}
label{display:block;margin-bottom:14px;font-size:10px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
input{font:inherit;display:block;width:100%;margin-top:6px;background:#000;border:1px solid #ffffff1a;border-radius:3px;padding:13px 18px;color:#fff;font-size:14px;font-weight:700;letter-spacing:normal;text-transform:none}
input:focus{border-color:var(--orange);outline:none}
button:focus-visible{outline:3px solid #ff854b;outline-offset:2px}
button{font:inherit;width:100%;border:0;border-radius:3px;padding:16px;background:var(--orange);color:#fff;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.16em;cursor:pointer;box-shadow:0 12px 30px #ff500033;margin-top:10px}
button:hover{opacity:.92}
button:disabled{opacity:.5;cursor:default}
#error{color:#f87171;font-size:13px;font-weight:700;text-align:center;min-height:20px;margin:16px 0 0}
@media(max-width:900px){.showcase{display:none}.panel{background:#111}}
</style>
</head>
<body>
<section class="showcase" aria-hidden="true">
  <img src="/brand/simbolo-periferica.png" alt="">
  <h2>Peri<span class="accent">flow</span></h2>
</section>
<section class="panel">
<main class="card">
  <div class="brand">
    <img src="/brand/logo-periferica.png" alt="Periférica">
    <h1>Entrar</h1>
    <p>Use o email e a senha do seu cadastro.</p>
  </div>
  <form id="loginForm">
    <label>Email<input id="email" type="email" autocomplete="username" required autofocus></label>
    <label>Senha<input id="password" type="password" autocomplete="current-password" required maxlength="128"></label>
    <button id="submit" type="submit">Entrar</button>
    <p id="error" role="alert"></p>
  </form>
</main>
</section>
<script>
// Se a sessão expirou dentro do iframe do sistema, mostra o login na janela inteira.
if(window.top!==window){try{window.top.location.replace(location.href);}catch{}}
const form=document.getElementById('loginForm'),button=document.getElementById('submit'),error=document.getElementById('error');
// Só aceita destinos dentro do próprio site.
function destination(){const next=new URLSearchParams(location.search).get('next')||'/';return next.startsWith('/')&&!next.startsWith('//')&&!next.startsWith('/login.html')?next:'/';}
form.onsubmit=async e=>{
  e.preventDefault();error.textContent='';button.disabled=true;button.textContent='Entrando…';
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw Error(d.error||'Não foi possível entrar.');
    location.replace(destination());
  }catch(err){error.textContent=err.message;button.disabled=false;button.textContent='Entrar';}
};
</script>
<script src="/js/password-eye.js?v=1"></script>
</body>
</html>
