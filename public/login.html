<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar • Periflow</title>
<link rel="icon" href="/favicon.svg">
<style>
:root{--orange:#ff5b0a;--text:#111827;--muted:#66758b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(110deg,#07111f,#040a13);color:var(--text)}
.card{width:min(400px,100%);background:#fff;border-radius:18px;padding:30px 26px;box-shadow:0 30px 80px #0006}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo{width:42px;height:42px;background:var(--orange);border-radius:11px;display:grid;place-items:center;font-weight:900;font-size:22px;color:#fff}
.brand strong{font-size:21px}
h1{font-size:20px;margin:0 0 4px}
p{margin:0 0 20px;color:var(--muted);font-size:14px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:800;color:#263244;margin-bottom:14px}
input{font:inherit;width:100%;border:1px solid #c3ccd8;border-radius:9px;padding:11px;color:var(--text);font-weight:600}
input:focus-visible,button:focus-visible{outline:3px solid #ff854b;outline-offset:2px}
button{font:inherit;width:100%;border:0;border-radius:10px;padding:12px;background:var(--orange);color:#fff;font-weight:750;cursor:pointer;box-shadow:0 8px 18px #ff5b0a2b;margin-top:6px}
button:disabled{opacity:.6;cursor:default}
#error{color:#b42318;font-size:14px;min-height:20px;margin:12px 0 0}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><div class="logo">P</div><strong>Periflow</strong></div>
  <h1>Entrar</h1>
  <p>Use o email e a senha do seu cadastro.</p>
  <form id="loginForm">
    <label>Email<input id="email" type="email" autocomplete="username" required autofocus></label>
    <label>Senha<input id="password" type="password" autocomplete="current-password" required maxlength="128"></label>
    <button id="submit" type="submit">Entrar</button>
    <p id="error" role="alert"></p>
  </form>
</main>
<script>
// Se a sessão expirou dentro do iframe do sistema, mostra o login na janela inteira.
if(window.top!==window){try{window.top.location.replace(location.href);}catch{}}
const form=document.getElementById('loginForm'),button=document.getElementById('submit'),error=document.getElementById('error');
// Só aceita destinos dentro do próprio site.
function destination(){const next=new URLSearchParams(location.search).get('next')||'/';return next.startsWith('/')&&!next.startsWith('//')&&!next.startsWith('/login.html')?next:'/';}
form.onsubmit=async e=>{
  e.preventDefault();error.textContent='';button.disabled=true;button.textContent='Entrando…';
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw Error(d.error||'Não foi possível entrar.');
    location.replace(destination());
  }catch(err){error.textContent=err.message;button.disabled=false;button.textContent='Entrar';}
};
</script>
</body>
</html>
